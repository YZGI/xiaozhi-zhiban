name: Build sair (ARM uClibc, with self.play_tv)

# 在 Linux runner 上原生运行 buildroot 工具链，编译含 self.play_tv 的 sair。
# 前置：仓库内需包含 device/assistant/ (源码) 与 device/toolchain/tc.tar.xz (ARM uClibc 工具链)。
on:
  workflow_dispatch:        # 允许在 Actions 页面手动触发
  push:
    paths:
      - 'device/**'
      - '.github/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 关键修复：Windows 创建的 .sh 文件带 CRLF (\r\n)，Linux 上 shebang 变成 #!/bin/bash\r 导致 exit code 127
      - name: Fix CRLF line endings (Windows -> Linux)
        run: |
          find . -name '*.sh' -exec sed -i 's/\r$//' {} +
          echo "✅ CRLF fixed in all .sh files"

      - name: Install xz-utils & Extract ARM uClibc toolchain
        run: |
          set -x
          which xz || (apt-get update && apt-get install -y xz-utils)
          echo "=== Repository structure ==="
          ls -la device/
          echo "=== Check toolchain archive ==="
          test -f device/toolchain/tc.tar.xz || { echo "❌ 缺少 device/toolchain/tc.tar.xz"; ls -laR device/toolchain/ 2>/dev/null || true; exit 1; }
          echo "tc.tar.xz size: $(stat -c%s device/toolchain/tc.tar.xz) bytes"
          cd device/toolchain
          tar xJf tc.tar.xz
          echo "=== Toolchain contents ==="
          ls arm-buildroot-linux-uclibcgnueabi_sdk-buildroot/bin/arm-buildroot-linux-uclibcgnueabi-gcc || { echo "❌ 工具链解压后缺少 gcc"; exit 1; }

      - name: Build sair (includes self.play_tv)
        run: |
          set -x
          cd device/assistant
          # 确认脚本可执行且无 CRLF
          head -1 build.sh | cat -v
          bash build.sh

      - name: Verify TV (v11) symbols are present
        run: |
          grep -q "self.play_tv" device/assistant/src/mcp_handler.c \
            && echo "✅ self.play_tv wired" || echo "⚠️ play_tv not found"
          grep -q "mcp_play_tv" device/assistant/src/mcp_handler.c \
            && echo "✅ mcp_play_tv wired (离线命令词播放)" || echo "⚠️ mcp_play_tv not found"
          grep -q "media_navi_open" device/assistant/src/mcp_handler.c \
            && echo "✅ media_navi_open (设备原厂媒体链路)" || echo "⚠️ media_navi_open not found"
          grep -q "TV_PLAY_WAKEUP_INDEX" device/assistant/include/xiaozhi_config.h \
            && echo "✅ TV 离线命令词索引常量就位" || echo "⚠️ TV index const not found"

      - name: Upload sair artifact
        uses: actions/upload-artifact@v4
        with:
          name: sair
          path: device/assistant/prebuilt/sair
          if-no-files-found: error
